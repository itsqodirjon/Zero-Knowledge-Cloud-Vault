version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cloud_vault_backend
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - vault_net

  nginx:
    image: nginx:alpine
    container_name: cloud_vault_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - vault_net

networks:
  vault_net:
    driver: bridge
